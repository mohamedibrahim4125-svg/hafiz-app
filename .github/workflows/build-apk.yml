name: بناء تطبيق أندرويد (APK)
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: تسطيب المكتبات
        run: npm install --no-audit --no-fund
      - name: مفتاح التوقيع (من Secrets)
        env:
          KS: ${{ secrets.HAFIZ_KEYSTORE }}
        run: |
          if [ -z "$KS" ]; then echo "::error::الـ Secret اللي اسمه HAFIZ_KEYSTORE مش موجود"; exit 1; fi
          echo "$KS" | tr -d ' \r\n' | base64 -d > resources/hafiz.keystore
          keytool -list -v -keystore resources/hafiz.keystore -storepass hafizapp | grep -m1 "SHA256:"
      - name: تجهيز مشروع أندرويد
        run: |
          pip install pillow
          sed -i "s/__APP_BUILD__/${GITHUB_RUN_NUMBER}/" www/index.html
          grep -c "parseInt(\"${GITHUB_RUN_NUMBER}\"" www/index.html
          if [ ! -d android ]; then npx cap add android; fi
          node scripts/patch-android.js
          npx cap sync android
      - name: بناء APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../hafiz.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hafiz-apk
          path: hafiz.apk
      - name: نشر الـ APK في Releases (علشان تنزّله من الموبايل مباشرة)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: حافظ — نسخة ${{ github.run_number }}
          files: hafiz.apk
          make_latest: true
          body: ${{ github.event.head_commit.message }}
