name: بناء تطبيق أندرويد (APK)
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: تسطيب المكتبات
        run: npm install --no-audit --no-fund
      - name: تجهيز مشروع أندرويد
        run: |
          pip install pillow
          if [ ! -d android ]; then npx cap add android; fi
          node scripts/patch-android.js
          npx cap sync android
      - name: بناء APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../hafiz.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hafiz-apk
          path: hafiz.apk
      - name: نشر الـ APK في Releases (علشان تنزّله من الموبايل مباشرة)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: حافظ — نسخة ${{ github.run_number }}
          files: hafiz.apk
